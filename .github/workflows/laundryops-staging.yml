name: Deploy LaundryOps Staging

on:
  push:
    branches:
      - feature/stripe-checkout-dedup
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging-billing:
    name: Deploy staging billing release
    runs-on: ubuntu-latest
    concurrency:
      group: laundryops-staging
      cancel-in-progress: false
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.STAGING_VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.STAGING_VITE_FIREBASE_APP_ID }}
      VITE_BILLING_API_BASE_URL: ${{ secrets.STAGING_VITE_BILLING_API_BASE_URL }}
      VITE_FUNCTIONS_API_BASE_URL: ${{ secrets.STAGING_VITE_FUNCTIONS_API_BASE_URL }}
      VITE_RELEASE_COMMIT: ${{ github.sha }}
      STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STAGING_STRIPE_MONTHLY_PRICE_ID }}
      STRIPE_ANNUAL_PRICE_ID: ${{ secrets.STAGING_STRIPE_ANNUAL_PRICE_ID }}
      DOCUMENT_AI_OCR_PROCESSOR_ID: ${{ secrets.STAGING_DOCUMENT_AI_OCR_PROCESSOR_ID }}
      DOCUMENT_AI_OCR_LOCATION: us
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/functions/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Validate app, rules, and billing Functions
        env:
          RULES_TEST_PROJECT_ID: laundryops-staging
          RULES_TEST_BUCKET_URL: gs://laundryops-staging.firebasestorage.app
        run: |
          npm run lint
          npm run test:onboarding
          npx firebase-tools emulators:exec --config firebase.staging.json --project laundryops-staging --only firestore,storage "npx vitest run --configLoader runner --config vitest.rules.config.ts"
          npm run build:staging
          npm --prefix functions run lint
          npm --prefix functions test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ vars.LAUNDRYOPS_STAGING_WIF_PROVIDER }}'
          service_account: '${{ vars.LAUNDRYOPS_STAGING_DEPLOY_SA }}'

      - name: Verify staging configuration
        shell: bash
        run: |
          required_vars=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
            VITE_BILLING_API_BASE_URL
            VITE_FUNCTIONS_API_BASE_URL
            STRIPE_MONTHLY_PRICE_ID
            STRIPE_ANNUAL_PRICE_ID
            DOCUMENT_AI_OCR_PROCESSOR_ID
            DOCUMENT_AI_OCR_LOCATION
          )
          for var_name in "${required_vars[@]}"; do
            test -n "${!var_name}" || { echo "$var_name is missing."; exit 1; }
          done
          test "$VITE_FIREBASE_PROJECT_ID" = "laundryops-staging"
          test "$VITE_FIREBASE_AUTH_DOMAIN" = "laundryops-staging.firebaseapp.com"
          test "$VITE_FIREBASE_STORAGE_BUCKET" = "laundryops-staging.firebasestorage.app"
          expected_functions_url="https://us-central1-laundryops-staging.cloudfunctions.net"
          test "$VITE_BILLING_API_BASE_URL" = "$expected_functions_url"
          test "$VITE_FUNCTIONS_API_BASE_URL" = "$expected_functions_url"
          for secret_name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET OPENAI_API_KEY; do
            gcloud secrets describe "$secret_name" --project laundryops-staging --quiet >/dev/null
            gcloud secrets versions list "$secret_name" --project laundryops-staging --filter="state=ENABLED" --limit=1 --format="value(name)" | grep -q .
          done

      - name: Configure staging Function environment
        shell: bash
        run: |
          # Firebase validates every declared parameter while loading this source.
          cat > functions/.env.laundryops-staging <<EOF
          LAUNDRYOPS_APP_URL=https://laundryops-staging.web.app
          LAUNDRYOPS_ALLOWED_CORS_ORIGINS=https://laundryops-staging.web.app,https://laundryops-staging.firebaseapp.com
          STRIPE_MONTHLY_PRICE_ID=$STRIPE_MONTHLY_PRICE_ID
          STRIPE_ANNUAL_PRICE_ID=$STRIPE_ANNUAL_PRICE_ID
          STRIPE_SUCCESS_URL=https://laundryops-staging.web.app/account?billing=success
          STRIPE_CANCEL_URL=https://laundryops-staging.web.app/account?billing=cancel
          STRIPE_BILLING_RETURN_URL=https://laundryops-staging.web.app/account
          DOCUMENT_AI_OCR_PROCESSOR_ID=$DOCUMENT_AI_OCR_PROCESSOR_ID
          DOCUMENT_AI_OCR_LOCATION=$DOCUMENT_AI_OCR_LOCATION
          EOF

      - name: Deploy staging application Functions
        env:
          LAUNDRYOPS_APP_URL: https://laundryops-staging.web.app
          LAUNDRYOPS_ALLOWED_CORS_ORIGINS: https://laundryops-staging.web.app,https://laundryops-staging.firebaseapp.com
        run: >-
          npx firebase-tools deploy --config firebase.staging.json --project laundryops-staging
          --only functions:completeOwnerOnboarding,functions:updateMachineOperationalStatus,functions:createStripeCheckoutSession,functions:createStripeBillingPortalSession,functions:indexOrganizationManual,functions:reindexOrganizationManuals,functions:refreshManualMachineCoverage,functions:completeManualOcrJobs,functions:deleteOrganizationManual,functions:generateRepairAssist,functions:stripeWebhook
          --non-interactive

      - name: Deploy staging data rules
        run: npx firebase-tools deploy --config firebase.staging.json --project laundryops-staging --only firestore:rules,firestore:indexes,storage --non-interactive

      - name: Deploy staging Hosting
        run: npx firebase-tools deploy --config firebase.staging.json --project laundryops-staging --only hosting --non-interactive

      - name: Verify deployed staging resources
        shell: bash
        run: |
          set -euo pipefail

          required_functions=(
            completeOwnerOnboarding
            updateMachineOperationalStatus
            createStripeCheckoutSession
            createStripeBillingPortalSession
            indexOrganizationManual
            reindexOrganizationManuals
            refreshManualMachineCoverage
            completeManualOcrJobs
            deleteOrganizationManual
            generateRepairAssist
            stripeWebhook
          )
          functions_json="$(npx firebase-tools functions:list --config firebase.staging.json --project laundryops-staging --json)"
          for function_name in "${required_functions[@]}"; do
            printf '%s' "$functions_json" | grep -q "\"id\": \"$function_name\"" || {
              echo "Required staging Function is missing: $function_name"
              exit 1
            }
          done

          shell_html="$(curl --fail --silent --show-error "https://laundryops-staging.web.app/")"
          printf '%s' "$shell_html" | grep -q "$GITHUB_SHA"
          asset_paths="$(printf '%s' "$shell_html" | grep -oE '/assets/[^" ]+\.(js|css)' | sort -u || true)"
          while IFS= read -r asset_path; do
            [ -n "$asset_path" ] || continue
            asset_content="$(curl --fail --silent --show-error "https://laundryops-staging.web.app$asset_path")"
            if printf '%s' "$asset_content" | grep -Eqi 'laundromat-maintenance-app|laundryops-maintenance-app|sk_live_|pk_live_|cs_live_'; then
              echo "Production or live Stripe marker found in staging asset: $asset_path"
              exit 1
            fi
          done <<< "$asset_paths"

          endpoint="https://us-central1-laundryops-staging.cloudfunctions.net/completeOwnerOnboarding"
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --dump-header "$headers_file" --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://laundryops-staging.web.app' \
            --header 'Content-Type: application/json' \
            --data '{"requestId":"deployment-smoke","draft":{}}' \
            "$endpoint")"
          test "$status" = "401"
          grep -qi '^access-control-allow-origin: https://laundryops-staging.web.app' "$headers_file"
          grep -q '"code":"onboarding_failed"' "$response_file"
          rm -f "$response_file" "$headers_file"
